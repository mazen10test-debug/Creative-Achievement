kind = "web"
previewPath = "/"
title = "الإنجاز الإبداعي"
version = "1.0.0"
id = "artifacts/injaz-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24079

[services.development]
run = "pnpm --filter @workspace/injaz-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/injaz-website", "run", "build" ]
publicDir = "artifacts/injaz-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24079"
BASE_PATH = "/"
